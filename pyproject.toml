[project]
name = "spotexport"
version = "0.1.0"
description = "Export Spotify tracks with pluggable type-safe exporters (Protocol + Generic)"
requires-python = ">=3.11"
dependencies = ["spotipy>=2.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotexport"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["spotexport", "tests", "examples"]

# spotipy не поставляет аннотаций типов (нет py.typed): его типизирует
# наш протокол SpotifyApi в spotexport/spotify.py
[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
